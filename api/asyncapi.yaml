asyncapi: 3.0.0
id: urn:synpex:lab-protocol:game
info:
  title: Das verrückte Labyrinth - Spielserver WebSocket
  version: 1.0.0
  description: "Vertrag aus den bereitgestellten PDFs, aus Sicht des Spielservers: receive = Client
    sendet Befehl, send = Server sendet Event. Genau eine persistente WebSocket-Verbindung unter
    ws://host:port/game; JSON-Textnachrichten mit type/data-Envelope. Im Repository ist noch kein
    Spielserver implementiert. Diese Version bildet die dokumentierten Nachrichten ab;
    Abstimmungslücken sind in README.md und Beschreibungen benannt. Erweiterungsfelder sind erlaubt,
    außer bei ausdrücklich leerem data/params."
  contact:
    name: Schnittstellenteam
    url: https://github.com/Synpex/lab-protocol
  tags:
    - name: Game
      description: Client-Befehle und Server-Ereignisse über dieselbe Verbindung
defaultContentType: application/json
servers:
  gameServer:
    host: "{host}:{port}"
    protocol: ws
    description: host und port aus GET /api/servers. Defaults sind Beispiele, kein bereitgestellter Server.
    variables:
      host:
        default: localhost
        description: Adresse des ausgewählten Spielservers
      port:
        default: "9000"
        description: Port des ausgewählten Spielservers
channels:
  game:
    address: /game
    description: Ein WebSocket-Endpunkt für alle Nachrichtentypen. Auswahl anhand payload.type, kein
      separater URL-Pfad pro Nachricht.
    servers:
      - $ref: "#/servers/gameServer"
    bindings:
      ws:
        method: GET
        bindingVersion: 0.1.0
    messages:
      CONNECT:
        $ref: "#/components/messages/CONNECT"
      DISCONNECT:
        $ref: "#/components/messages/DISCONNECT"
      START_GAME:
        $ref: "#/components/messages/START_GAME"
      ROTATE_SPARE_TILE:
        $ref: "#/components/messages/ROTATE_SPARE_TILE"
      PUSH_TILE:
        $ref: "#/components/messages/PUSH_TILE"
      MOVE_FIGURE:
        $ref: "#/components/messages/MOVE_FIGURE"
      PASS_MOVE:
        $ref: "#/components/messages/PASS_MOVE"
      USE_BONUS:
        $ref: "#/components/messages/USE_BONUS"
      SET_AI_MODE:
        $ref: "#/components/messages/SET_AI_MODE"
      REMATCH_REQUEST:
        $ref: "#/components/messages/REMATCH_REQUEST"
      SERVER_INFO:
        $ref: "#/components/messages/SERVER_INFO"
      CONNECT_ACK:
        $ref: "#/components/messages/CONNECT_ACK"
      LOBBY_STATE:
        $ref: "#/components/messages/LOBBY_STATE"
      GAME_STARTED:
        $ref: "#/components/messages/GAME_STARTED"
      NEXT_TREASURE:
        $ref: "#/components/messages/NEXT_TREASURE"
      GAME_STATE_UPDATE:
        $ref: "#/components/messages/GAME_STATE_UPDATE"
      BONUS_SPAWNED:
        $ref: "#/components/messages/BONUS_SPAWNED"
      BONUS_COLLECTED:
        $ref: "#/components/messages/BONUS_COLLECTED"
      BONUS_USED:
        $ref: "#/components/messages/BONUS_USED"
      TREASURE_FOUND:
        $ref: "#/components/messages/TREASURE_FOUND"
      PLAYER_UPDATED:
        $ref: "#/components/messages/PLAYER_UPDATED"
      ACHIEVEMENT_UNLOCKED:
        $ref: "#/components/messages/ACHIEVEMENT_UNLOCKED"
      TIMEOUT_WARNING:
        $ref: "#/components/messages/TIMEOUT_WARNING"
      PLAYER_DISCONNECTED:
        $ref: "#/components/messages/PLAYER_DISCONNECTED"
      GAME_OVER:
        $ref: "#/components/messages/GAME_OVER"
      REMATCH_STATUS:
        $ref: "#/components/messages/REMATCH_STATUS"
      ERROR:
        $ref: "#/components/messages/ERROR"
operations:
  receiveConnect:
    action: receive
    channel:
      $ref: "#/channels/game"
    summary: Lobby beitreten oder Session wiederaufnehmen
    description: Innerhalb von 10 Sekunden nach WebSocket-Verbindung senden. Im laufenden Spiel nur mit
      gültigem identifierToken. Antworten CONNECT_ACK und LOBBY_STATE; beim Reconnect danach
      Full-State und NEXT_TREASURE. Fehler LOBBY_FULL, USERNAME_TAKEN, GAME_ALREADY_STARTED.
    messages:
      - $ref: "#/channels/game/messages/CONNECT"
  receiveDisconnect:
    action: receive
    channel:
      $ref: "#/channels/game"
    summary: Sauber abmelden
    description: Lobby oder Partie bewusst verlassen.
    messages:
      - $ref: "#/channels/game/messages/DISCONNECT"
  receiveStartGame:
    action: receive
    channel:
      $ref: "#/channels/game"
    summary: Partie starten und konfigurieren
    description: Nur Admin, mindestens 2 Spieler. GAME_STARTED, Full-State und private NEXT_TREASURE
      folgen. Fehler NOT_ADMIN, NOT_ENOUGH_PLAYERS, INVALID_CONFIG.
    messages:
      - $ref: "#/channels/game/messages/START_GAME"
  receiveRotateSpareTile:
    action: receive
    channel:
      $ref: "#/channels/game"
    summary: Ersatzkachel um 90 Grad drehen
    description: Im Uhrzeigersinn; nur aktiver Spieler in WAITING_FOR_PUSH. Aktualisiert entrances und
      rotation. Fehler NOT_YOUR_TURN, INVALID_ACTION. Eigenständiger Befehl bleibt gemäß
      API-Dokumentation erhalten.
    messages:
      - $ref: "#/channels/game/messages/ROTATE_SPARE_TILE"
  receivePushTile:
    action: receive
    channel:
      $ref: "#/channels/game"
    summary: Ersatzkachel einschieben
    description: Nur WAITING_FOR_PUSH, aktiver Spieler. Regulär ungerade innere Indizes; direkten
      Gegenschub des Vorzugs ablehnen. Figuren auf herausgeschobener Kachel per Wrap-Around auf
      gegenüberliegende eingeschobene Kachel setzen. Richtung bezeichnet die Schieberichtung. Danach
      WAITING_FOR_MOVE und berechnete reachablePositions. Fehler INVALID_PUSH, NOT_YOUR_TURN.
    messages:
      - $ref: "#/channels/game/messages/PUSH_TILE"
  receiveMoveFigure:
    action: receive
    channel:
      $ref: "#/channels/game"
    summary: Figur zu erreichbarem Ziel ziehen
    description: Nur WAITING_FOR_MOVE. Ziel muss über offene Gänge erreichbar und frei sein. Über andere
      Figuren darf hinweggezogen werden. Nur Zielfeld sammelt Schätze/Boni; Schritte gemäß Q&A über
      kürzesten Weg. Danach nächster Spieler. Fehler TARGET_UNREACHABLE, POSITION_OCCUPIED.
    messages:
      - $ref: "#/channels/game/messages/MOVE_FIGURE"
  receivePassMove:
    action: receive
    channel:
      $ref: "#/channels/game"
    summary: Ohne Bewegung Zug beenden
    description: Nur WAITING_FOR_MOVE; Figur bleibt stehen.
    messages:
      - $ref: "#/channels/game/messages/PASS_MOVE"
  receiveUseBonus:
    action: receive
    channel:
      $ref: "#/channels/game"
    summary: Bonus aus Inventar verwenden
    description: Bonus muss verfügbar sein, einmalig verbrauchen. BEAM teleportiert auf freies Feld,
      SWAP tauscht mit anderem Spieler, PUSH_FIXED schiebt gerade innere Reihe/Spalte, PUSH_TWICE
      ermöglicht zweiten Schub. BONUS_USED und Full-State folgen. Fehler BONUS_NOT_AVAILABLE,
      INVALID_BONUS_TARGET. BONUS ist eine Rubrik, kein zusätzlicher TurnState.
    messages:
      - $ref: "#/channels/game/messages/USE_BONUS"
  receiveSetAiMode:
    action: receive
    channel:
      $ref: "#/channels/game"
    summary: Client-KI aktivieren oder deaktivieren
    description: KI rechnet vollständig auf dem Client. Server setzt/loggt isAiControlled und sendet
      PLAYER_UPDATED; er führt selbst keine KI-Züge aus.
    messages:
      - $ref: "#/channels/game/messages/SET_AI_MODE"
  receiveRematchRequest:
    action: receive
    channel:
      $ref: "#/channels/game"
    summary: Revanche-Zusage abgeben
    description: Nach GAME_OVER. Vormatch-Spieler haben für 15 Sekunden Vorrang; dann öffnet sich die
      Lobby für neue Spieler.
    messages:
      - $ref: "#/channels/game/messages/REMATCH_REQUEST"
  sendServerInfo:
    action: send
    channel:
      $ref: "#/channels/game"
    summary: Empfangsbereitschaft und Serverzeit
    description: Sofort nach erfolgreichem WebSocket-Handshake.
    messages:
      - $ref: "#/channels/game/messages/SERVER_INFO"
  sendConnectAck:
    action: send
    channel:
      $ref: "#/channels/game"
    summary: Verbindung bestätigt
    description: identifierToken im Client speichern; Reconnect-Fenster 30 Sekunden. Admin ist der
      dienstälteste anwesende Spieler, nach Abgang/Timeout rückt der nächste nach.
    messages:
      - $ref: "#/channels/game/messages/CONNECT_ACK"
  sendLobbyState:
    action: send
    channel:
      $ref: "#/channels/game"
    summary: Lobby-Teilnehmer und Startbereitschaft
    description: Nach Join/Änderung an alle Lobby-Spieler.
    messages:
      - $ref: "#/channels/game/messages/LOBBY_STATE"
  sendGameStarted:
    action: send
    channel:
      $ref: "#/channels/game"
    summary: Spielstart und Ersatzkachel
    description: Unmittelbar danach vollständiges GAME_STATE_UPDATE und private NEXT_TREASURE. Diese
      Nachricht allein ist kein vollständiger Board-Snapshot.
    messages:
      - $ref: "#/channels/game/messages/GAME_STARTED"
  sendNextTreasure:
    action: send
    channel:
      $ref: "#/channels/game"
    summary: Nächste geheime Schatzkarte
    description: Ausschließlich an den berechtigten Spieler; niemals broadcasten. Nach Start, nach
      gefundenem Schatz und beim Reconnect.
    messages:
      - $ref: "#/channels/game/messages/NEXT_TREASURE"
  sendGameStateUpdate:
    action: send
    channel:
      $ref: "#/channels/game"
    summary: Vollständigen Spielzustand übertragen
    description: Nach jeder Aktion Full-State; keine Deltas. Beim Reconnect zusätzlich Unicast an den
      wiederverbundenen Client. Geheime Schatzkarte und identifierToken gehören nicht in diesen
      Broadcast.
    messages:
      - $ref: "#/channels/game/messages/GAME_STATE_UPDATE"
  sendBonusSpawned:
    action: send
    channel:
      $ref: "#/channels/game"
    summary: Bonus auf Kachel erschienen
    description: Pro Kachel höchstens ein Bonus oder ein Schatz; Bonus bleibt beim Schieben an seiner Kachel.
    messages:
      - $ref: "#/channels/game/messages/BONUS_SPAWNED"
  sendBonusCollected:
    action: send
    channel:
      $ref: "#/channels/game"
    summary: Bonus eingesammelt
    description: Bonus zum Spielerinventar hinzufügen.
    messages:
      - $ref: "#/channels/game/messages/BONUS_COLLECTED"
  sendBonusUsed:
    action: send
    channel:
      $ref: "#/channels/game"
    summary: Bonus erfolgreich verbraucht
    description: details ist nur für SWAP konkret dokumentiert; für übrige Boni keine verbindlichen
      Feldnamen festgelegt.
    messages:
      - $ref: "#/channels/game/messages/BONUS_USED"
  sendTreasureFound:
    action: send
    channel:
      $ref: "#/channels/game"
    summary: Aktuellen Schatz gefunden
    description: Danach private NEXT_TREASURE; Punktwert im Beispiel ist keine verbindliche Punkte-Regel.
    messages:
      - $ref: "#/channels/game/messages/TREASURE_FOUND"
  sendPlayerUpdated:
    action: send
    channel:
      $ref: "#/channels/game"
    summary: Spielerstatus geändert
    description: Teilupdate für Client-KI oder Verbindungsstatus.
    messages:
      - $ref: "#/channels/game/messages/PLAYER_UPDATED"
  sendAchievementUnlocked:
    action: send
    channel:
      $ref: "#/channels/game"
    summary: Achievement freigeschaltet
    description: Achievements sind verpflichtend, Namen und Punktwerte dürfen serverabhängig sein.
    messages:
      - $ref: "#/channels/game/messages/ACHIEVEMENT_UNLOCKED"
  sendTimeoutWarning:
    action: send
    channel:
      $ref: "#/channels/game"
    summary: Timeout-Countdown ankündigen
    description: "Beispiel: 3 Sekunden Vorwarnung nach 30 Sekunden Inaktivität. Genaue Kopplung an
      Zuglimit/Reconnect siehe offene Punkte in README."
    messages:
      - $ref: "#/channels/game/messages/TIMEOUT_WARNING"
  sendPlayerDisconnected:
    action: send
    channel:
      $ref: "#/channels/game"
    summary: Spieler ausgeschieden
    description: Nach freiwilligem Abgang oder Kick; Figur entfernen und ggf. nächsten Spieler aktivieren.
    messages:
      - $ref: "#/channels/game/messages/PLAYER_DISCONNECTED"
  sendGameOver:
    action: send
    channel:
      $ref: "#/channels/game"
    summary: Spielende mit Rangliste und Kennzahlen
    description: Alle Schätze und Rückkehr zur homePosition bilden die Siegbedingung; Ende beim ersten
      Sieger oder Weiterspielen ist serverabhängig. Punktesystem und Gleichstand nicht festgelegt.
    messages:
      - $ref: "#/channels/game/messages/GAME_OVER"
  sendRematchStatus:
    action: send
    channel:
      $ref: "#/channels/game"
    summary: Revanche-Zusagen und Lobby-Öffnung
    description: Vormatch-Spieler erhalten 15 Sekunden Vorrang.
    messages:
      - $ref: "#/channels/game/messages/REMATCH_STATUS"
  sendError:
    action: send
    channel:
      $ref: "#/channels/game"
    summary: Befehl abgewiesen
    description: Nur an Verursacher; Spielzustand unverändert. Beliebig viele Wiederholungsversuche,
      Zugzeit läuft weiter. correlationType korreliert nur den Befehlstyp, keine einzelne Anfrage.
    messages:
      - $ref: "#/channels/game/messages/ERROR"
components:
  messages:
    CONNECT:
      name: CONNECT
      title: Lobby beitreten oder Session wiederaufnehmen
      summary: Lobby beitreten oder Session wiederaufnehmen
      description: Innerhalb von 10 Sekunden nach WebSocket-Verbindung senden. Im laufenden Spiel nur mit
        gültigem identifierToken. Antworten CONNECT_ACK und LOBBY_STATE; beim Reconnect danach
        Full-State und NEXT_TREASURE. Fehler LOBBY_FULL, USERNAME_TAKEN, GAME_ALREADY_STARTED.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ConnectEnvelope"
      examples:
        - name: connect
          summary: Lobby beitreten oder Session wiederaufnehmen
          payload:
            type: CONNECT
            data:
              username: Alice
        - name: reconnect
          payload:
            type: CONNECT
            data:
              username: Alice
              identifierToken: token-98f2-4bc1-912a
      x-delivery: client to server
      x-source-pages:
        - 13
    DISCONNECT:
      name: DISCONNECT
      title: Sauber abmelden
      summary: Sauber abmelden
      description: Lobby oder Partie bewusst verlassen.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/DisconnectEnvelope"
      examples:
        - name: disconnect
          summary: Sauber abmelden
          payload:
            type: DISCONNECT
            data: {}
      x-delivery: client to server
      x-source-pages:
        - 14
    START_GAME:
      name: START_GAME
      title: Partie starten und konfigurieren
      summary: Partie starten und konfigurieren
      description: Nur Admin, mindestens 2 Spieler. GAME_STARTED, Full-State und private NEXT_TREASURE
        folgen. Fehler NOT_ADMIN, NOT_ENOUGH_PLAYERS, INVALID_CONFIG.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/StartGameEnvelope"
      examples:
        - name: start_game
          summary: Partie starten und konfigurieren
          payload:
            type: START_GAME
            data:
              boardSize:
                rows: 7
                cols: 7
              maxPlayers: 4
              treasureCardCount: 6
              gameDurationInSeconds: 1800
              turnTimeoutInSeconds: 30
              bonusSpawnInterval: 3
      x-delivery: client to server
      x-source-pages:
        - 15
    ROTATE_SPARE_TILE:
      name: ROTATE_SPARE_TILE
      title: Ersatzkachel um 90 Grad drehen
      summary: Ersatzkachel um 90 Grad drehen
      description: Im Uhrzeigersinn; nur aktiver Spieler in WAITING_FOR_PUSH. Aktualisiert entrances und
        rotation. Fehler NOT_YOUR_TURN, INVALID_ACTION. Eigenständiger Befehl bleibt gemäß
        API-Dokumentation erhalten.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/RotateSpareTileEnvelope"
      examples:
        - name: rotate_spare_tile
          summary: Ersatzkachel um 90 Grad drehen
          payload:
            type: ROTATE_SPARE_TILE
            data: {}
      x-delivery: client to server
      x-source-pages:
        - 17
    PUSH_TILE:
      name: PUSH_TILE
      title: Ersatzkachel einschieben
      summary: Ersatzkachel einschieben
      description: Nur WAITING_FOR_PUSH, aktiver Spieler. Regulär ungerade innere Indizes; direkten
        Gegenschub des Vorzugs ablehnen. Figuren auf herausgeschobener Kachel per Wrap-Around auf
        gegenüberliegende eingeschobene Kachel setzen. Richtung bezeichnet die Schieberichtung.
        Danach WAITING_FOR_MOVE und berechnete reachablePositions. Fehler INVALID_PUSH,
        NOT_YOUR_TURN.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/PushTileEnvelope"
      examples:
        - name: push_tile
          summary: Ersatzkachel einschieben
          payload:
            type: PUSH_TILE
            data:
              rowOrColIndex: 1
              direction: RIGHT
      x-delivery: client to server
      x-source-pages:
        - 18
    MOVE_FIGURE:
      name: MOVE_FIGURE
      title: Figur zu erreichbarem Ziel ziehen
      summary: Figur zu erreichbarem Ziel ziehen
      description: Nur WAITING_FOR_MOVE. Ziel muss über offene Gänge erreichbar und frei sein. Über andere
        Figuren darf hinweggezogen werden. Nur Zielfeld sammelt Schätze/Boni; Schritte gemäß Q&A
        über kürzesten Weg. Danach nächster Spieler. Fehler TARGET_UNREACHABLE, POSITION_OCCUPIED.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/MoveFigureEnvelope"
      examples:
        - name: move_figure
          summary: Figur zu erreichbarem Ziel ziehen
          payload:
            type: MOVE_FIGURE
            data:
              targetCoordinates:
                row: 3
                column: 4
      x-delivery: client to server
      x-source-pages:
        - 19
    PASS_MOVE:
      name: PASS_MOVE
      title: Ohne Bewegung Zug beenden
      summary: Ohne Bewegung Zug beenden
      description: Nur WAITING_FOR_MOVE; Figur bleibt stehen.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/PassMoveEnvelope"
      examples:
        - name: pass_move
          summary: Ohne Bewegung Zug beenden
          payload:
            type: PASS_MOVE
            data: {}
      x-delivery: client to server
      x-source-pages:
        - 20
    USE_BONUS:
      name: USE_BONUS
      title: Bonus aus Inventar verwenden
      summary: Bonus aus Inventar verwenden
      description: Bonus muss verfügbar sein, einmalig verbrauchen. BEAM teleportiert auf freies Feld,
        SWAP tauscht mit anderem Spieler, PUSH_FIXED schiebt gerade innere Reihe/Spalte, PUSH_TWICE
        ermöglicht zweiten Schub. BONUS_USED und Full-State folgen. Fehler BONUS_NOT_AVAILABLE,
        INVALID_BONUS_TARGET. BONUS ist eine Rubrik, kein zusätzlicher TurnState.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/UseBonusEnvelope"
      examples:
        - name: use_bonus
          summary: Bonus aus Inventar verwenden
          payload:
            type: USE_BONUS
            data:
              bonusType: BEAM
              params:
                targetCoordinates:
                  row: 5
                  column: 2
        - name: swap
          payload:
            type: USE_BONUS
            data:
              bonusType: SWAP
              params:
                targetPlayerId: p-102
        - name: push_fixed
          payload:
            type: USE_BONUS
            data:
              bonusType: PUSH_FIXED
              params:
                rowOrColIndex: 2
                direction: DOWN
        - name: push_twice
          payload:
            type: USE_BONUS
            data:
              bonusType: PUSH_TWICE
              params: {}
      x-delivery: client to server
      x-source-pages:
        - 21
    SET_AI_MODE:
      name: SET_AI_MODE
      title: Client-KI aktivieren oder deaktivieren
      summary: Client-KI aktivieren oder deaktivieren
      description: KI rechnet vollständig auf dem Client. Server setzt/loggt isAiControlled und sendet
        PLAYER_UPDATED; er führt selbst keine KI-Züge aus.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/SetAiModeEnvelope"
      examples:
        - name: set_ai_mode
          summary: Client-KI aktivieren oder deaktivieren
          payload:
            type: SET_AI_MODE
            data:
              enabled: true
      x-delivery: client to server
      x-source-pages:
        - 23
    REMATCH_REQUEST:
      name: REMATCH_REQUEST
      title: Revanche-Zusage abgeben
      summary: Revanche-Zusage abgeben
      description: Nach GAME_OVER. Vormatch-Spieler haben für 15 Sekunden Vorrang; dann öffnet sich die
        Lobby für neue Spieler.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/RematchRequestEnvelope"
      examples:
        - name: rematch_request
          summary: Revanche-Zusage abgeben
          payload:
            type: REMATCH_REQUEST
            data:
              ready: true
      x-delivery: client to server
      x-source-pages:
        - 24
    SERVER_INFO:
      name: SERVER_INFO
      title: Empfangsbereitschaft und Serverzeit
      summary: Empfangsbereitschaft und Serverzeit
      description: Sofort nach erfolgreichem WebSocket-Handshake.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ServerInfoEnvelope"
      examples:
        - name: server_info
          summary: Empfangsbereitschaft und Serverzeit
          payload:
            type: SERVER_INFO
            data:
              serverVersion: 2.0.0
              serverTime: 2026-09-15T18:00:00Z
              motd: Willkommen am MCI Labyrinth Server!
      x-delivery: unicast
      x-source-pages:
        - 25
    CONNECT_ACK:
      name: CONNECT_ACK
      title: Verbindung bestätigt
      summary: Verbindung bestätigt
      description: identifierToken im Client speichern; Reconnect-Fenster 30 Sekunden. Admin ist der
        dienstälteste anwesende Spieler, nach Abgang/Timeout rückt der nächste nach.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ConnectAckEnvelope"
      examples:
        - name: connect_ack
          summary: Verbindung bestätigt
          payload:
            type: CONNECT_ACK
            data:
              playerId: p-101
              username: Alice
              playerColor: RED
              isAdmin: true
              identifierToken: token-98f2-4bc1-912a
      x-delivery: unicast
      x-source-pages:
        - 26
    LOBBY_STATE:
      name: LOBBY_STATE
      title: Lobby-Teilnehmer und Startbereitschaft
      summary: Lobby-Teilnehmer und Startbereitschaft
      description: Nach Join/Änderung an alle Lobby-Spieler.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/LobbyStateEnvelope"
      examples:
        - name: lobby_state
          summary: Lobby-Teilnehmer und Startbereitschaft
          payload:
            type: LOBBY_STATE
            data:
              players:
                - playerId: p-101
                  username: Alice
                  playerColor: RED
                  isConnected: true
                  isAiControlled: false
                  isAdmin: true
                - playerId: p-102
                  username: Bob
                  playerColor: BLUE
                  isConnected: true
                  isAiControlled: false
                  isAdmin: false
              canStart: true
      x-delivery: broadcast
      x-source-pages:
        - 27
    GAME_STARTED:
      name: GAME_STARTED
      title: Spielstart und Ersatzkachel
      summary: Spielstart und Ersatzkachel
      description: Unmittelbar danach vollständiges GAME_STATE_UPDATE und private NEXT_TREASURE. Diese
