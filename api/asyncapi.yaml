  schemas:
    Direction:
      type: string
      enum:
        - UP
        - DOWN
        - LEFT
        - RIGHT
    PlayerColor:
      type: string
      enum:
        - RED
        - BLUE
        - GREEN
        - YELLOW
    TurnState:
      type: string
      enum:
        - WAITING_FOR_PUSH
        - WAITING_FOR_MOVE
    BonusType:
      type: string
      enum:
        - BEAM
        - SWAP
        - PUSH_FIXED
        - PUSH_TWICE
    PlayerId:
      type: string
      description: Opaque Spielerkennung, z. B. p-101.
    Username:
      type: string
      minLength: 1
      maxLength: 50
    UtcTimestamp:
      type: string
      format: date-time
      pattern: Z$
      description: ISO-8601 UTC mit Z; maßgeblich ist die Serverzeit.
    Coordinates:
      type: object
      properties:
        row:
          type: integer
          description: Zeile, 0 bis board.rows - 1.
          minimum: 0
        column:
          type: integer
          description: Spalte, 0 bis board.cols - 1.
          minimum: 0
      description: Ursprung oben links; dynamische Obergrenzen prüft der Spielserver.
      required:
        - row
        - column
    BoardDimension:
      type: integer
      description: Ungerade Ganzzahl >= 3; keine gemeinsame Obergrenze festgelegt.
      not:
        multipleOf: 2
      minimum: 3
    BoardSize:
      type: object
      properties:
        rows:
          $ref: "#/components/schemas/BoardDimension"
        cols:
          $ref: "#/components/schemas/BoardDimension"
      required:
        - rows
        - cols
    Treasure:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      description: Schatzkennungen und Namen sind nicht gruppenübergreifend aufgelistet; keine erfundene
        ID-Range.
      required:
        - id
        - name
    Tile:
      type: object
      properties:
        entrances:
          type: array
          items:
            $ref: "#/components/schemas/Direction"
          uniqueItems: true
          description: Verbindliche offene Wege; rotation ist nur ein Darstellungswert.
        rotation:
          type: integer
          minimum: 0
          maximum: 3
        treasure:
          anyOf:
            - $ref: "#/components/schemas/Treasure"
            - type: "null"
        bonus:
          anyOf:
            - $ref: "#/components/schemas/BonusType"
            - type: "null"
        isFixed:
          type: boolean
      description: Genau ein Schatz oder ein Bonus oder keines von beiden. Bonus und Schatz bleiben an der
        Kachel, auch auf der Ersatzkachel.
      not:
        type: object
        required:
          - treasure
          - bonus
        properties:
          treasure:
            type: object
          bonus:
            type: string
      required:
        - entrances
        - rotation
        - treasure
        - bonus
        - isFixed
    Push:
      type: object
      properties:
        rowOrColIndex:
          type: integer
          description: Zeilenindex für LEFT/RIGHT; Spaltenindex für UP/DOWN.
          minimum: 0
        direction:
          $ref: "#/components/schemas/Direction"
      required:
        - rowOrColIndex
        - direction
    Board:
      type: object
      properties:
        rows:
          $ref: "#/components/schemas/BoardDimension"
        cols:
          $ref: "#/components/schemas/BoardDimension"
        tiles:
          type: array
          items:
            type: array
            items:
              $ref: "#/components/schemas/Tile"
            minItems: 3
          minItems: 3
          description: Vollständige Matrix tiles[row][column]; genau rows Zeilen mit je cols Kacheln.
        spareTile:
          $ref: "#/components/schemas/Tile"
        lastPush:
          $ref: "#/components/schemas/Push"
      description: lastPush optional, beim initialen Zustand weglassen. Matrix-Dimensionen sind dynamisch
        und serverseitig zu prüfen.
      required:
        - rows
        - cols
        - tiles
        - spareTile
    LobbyPlayer:
      type: object
      properties:
        playerId:
          $ref: "#/components/schemas/PlayerId"
        username:
          $ref: "#/components/schemas/Username"
        playerColor:
          $ref: "#/components/schemas/PlayerColor"
        isAdmin:
          type: boolean
        isAiControlled:
          type: boolean
        isConnected:
          type: boolean
      required:
        - playerId
        - username
        - playerColor
        - isAdmin
        - isAiControlled
        - isConnected
    GamePlayer:
      type: object
      properties:
        playerId:
          $ref: "#/components/schemas/PlayerId"
        username:
          $ref: "#/components/schemas/Username"
        playerColor:
          $ref: "#/components/schemas/PlayerColor"
        currentPosition:
          $ref: "#/components/schemas/Coordinates"
        homePosition:
          $ref: "#/components/schemas/Coordinates"
        remainingTreasureCount:
          type: integer
          minimum: 0
          maximum: 24
        availableBonuses:
          type: array
          items:
            $ref: "#/components/schemas/BonusType"
          description: Inventar; Größe und FIFO/freie Auswahl sind in den Quellen widersprüchlich, siehe README.
        isConnected:
          type: boolean
        isAiControlled:
          type: boolean
      required:
        - playerId
        - username
        - playerColor
        - currentPosition
        - homePosition
        - remainingTreasureCount
        - availableBonuses
        - isConnected
        - isAiControlled
    CurrentTurnInfo:
      type: object
      properties:
        activePlayerId:
          $ref: "#/components/schemas/PlayerId"
        turnState:
          $ref: "#/components/schemas/TurnState"
        turnEndTime:
          $ref: "#/components/schemas/UtcTimestamp"
        reachablePositions:
          type: array
          items:
            $ref: "#/components/schemas/Coordinates"
      description: Erreichbare Positionen werden serverseitig berechnet; im WAITING_FOR_PUSH-Beispiel
        leere Liste.
      required:
        - activePlayerId
        - turnState
        - turnEndTime
        - reachablePositions
    GameStats:
      type: object
      properties:
        stepsTaken:
          type: integer
          minimum: 0
        tilesPushed:
          type: integer
          minimum: 0
        treasuresCollected:
          type: integer
          minimum: 0
          maximum: 24
        blockedPaths:
          type: integer
          minimum: 0
        achievements:
          type: array
          items:
            type: string
      description: Achievement-Namen und Punktwerte sind serverabhängig; die Quellen definieren kein
        festes Enum.
      required:
        - stepsTaken
        - tilesPushed
        - treasuresCollected
        - blockedPaths
        - achievements
    RankingEntry:
      type: object
      properties:
        rank:
          type: integer
          minimum: 1
        playerId:
          $ref: "#/components/schemas/PlayerId"
        username:
          $ref: "#/components/schemas/Username"
        totalScore:
          type: integer
        stats:
          $ref: "#/components/schemas/GameStats"
      required:
        - rank
        - playerId
        - username
        - totalScore
        - stats
    ErrorCode:
      type: string
      enum:
        - GENERAL_ERROR
        - INVALID_COMMAND
        - PLAYER_NOT_CONNECTED
        - NOT_YOUR_TURN
        - INVALID_TURN_PHASE
        - INVALID_PUSH
        - TARGET_UNREACHABLE
        - POSITION_OCCUPIED
        - REVERSING_PATH_FORBIDDEN
        - BONUS_NOT_AVAILABLE
        - INVALID_BONUS_TARGET
        - LOBBY_FULL
        - USERNAME_TAKEN
        - GAME_ALREADY_STARTED
        - NOT_ADMIN
        - NOT_ENOUGH_PLAYERS
        - INVALID_CONFIG
        - INVALID_ACTION
      description: Tabelle auf PDF S. 43-44 plus INVALID_CONFIG (START_GAME) und INVALID_ACTION
        (ROTATE_SPARE_TILE) aus den Operationsbeschreibungen. Für letzteren besteht eine
        Abstimmungslücke.
    ConnectData:
      type: object
      properties:
        username:
          $ref: "#/components/schemas/Username"
        identifierToken:
          type: string
          description: Optional nur beim Reconnect; Token aus CONNECT_ACK.
      required:
        - username
    EmptyData:
      type: object
      properties: {}
      additionalProperties: false
    StartGameData:
      type: object
      properties:
        boardSize:
          $ref: "#/components/schemas/BoardSize"
        maxPlayers:
          type: integer
          minimum: 2
          maximum: 4
        treasureCardCount:
          type: integer
          default: 6
          description: Pro Spieler, insgesamt <= 24. Produkt mit tatsächlicher Spieleranzahl serverseitig
            prüfen.
          minimum: 0
          maximum: 24
        gameDurationInSeconds:
          type: integer
          description: 0 = unbegrenzt; wire-Darstellung von gameEndTime dafür noch offen.
          minimum: 0
        turnTimeoutInSeconds:
          type: integer
          description: Zeitlimit pro Zug; Bedeutung von 0 und Default nicht festgelegt.
          minimum: 0
        bonusSpawnInterval:
          type: integer
          description: Rundenabstand; Bedeutung von 0 und Default nicht festgelegt.
          minimum: 0
      required:
        - boardSize
    MoveFigureData:
      type: object
      properties:
        targetCoordinates:
          $ref: "#/components/schemas/Coordinates"
      required:
        - targetCoordinates
    UseBonusBeamData:
      type: object
      properties:
        bonusType:
          type: string
          const: BEAM
        params:
          type: object
          properties:
            targetCoordinates:
              $ref: "#/components/schemas/Coordinates"
          required:
            - targetCoordinates
      required:
        - bonusType
        - params
    UseBonusSwapData:
      type: object
      properties:
        bonusType:
          type: string
          const: SWAP
        params:
          type: object
          properties:
            targetPlayerId:
              $ref: "#/components/schemas/PlayerId"
          required:
            - targetPlayerId
      required:
        - bonusType
        - params
    UseBonusPushFixedData:
      type: object
      properties:
        bonusType:
          type: string
          const: PUSH_FIXED
        params:
          type: object
          properties:
            rowOrColIndex:
              type: integer
              multipleOf: 2
              description: Gerader innerer Index; nicht 0 und nicht letzter Randindex.
              minimum: 2
            direction:
              $ref: "#/components/schemas/Direction"
          required:
            - rowOrColIndex
            - direction
      required:
        - bonusType
        - params
    UseBonusPushTwiceData:
      type: object
      properties:
        bonusType:
          type: string
          const: PUSH_TWICE
        params:
          $ref: "#/components/schemas/EmptyData"
      required:
        - bonusType
        - params
    UseBonusData:
      oneOf:
        - $ref: "#/components/schemas/UseBonusBeamData"
        - $ref: "#/components/schemas/UseBonusSwapData"
        - $ref: "#/components/schemas/UseBonusPushFixedData"
        - $ref: "#/components/schemas/UseBonusPushTwiceData"
      description: params hängt strikt vom bonusType ab. PUSH_TWICE setzt WAITING_FOR_MOVE auf
        WAITING_FOR_PUSH; Phasen für übrige Boni noch nicht abschließend definiert.
    SetAiModeData:
      type: object
      properties:
        enabled:
          type: boolean
      required:
        - enabled
    RematchRequestData:
      type: object
      properties:
        ready:
          type: boolean
      required:
        - ready
    ServerInfoData:
      type: object
      properties:
        serverVersion:
          type: string
          description: Metadatum; keine Versionsaushandlung definiert.
        serverTime:
          $ref: "#/components/schemas/UtcTimestamp"
        motd:
          type: string
      required:
        - serverVersion
        - serverTime
        - motd
    ConnectAckData:
      type: object
      properties:
        playerId:
          $ref: "#/components/schemas/PlayerId"
        username:
          $ref: "#/components/schemas/Username"
        playerColor:
          $ref: "#/components/schemas/PlayerColor"
        isAdmin:
          type: boolean
        identifierToken:
          type: string
          description: Nur an diesen Client senden und für Reconnect speichern.
      required:
        - playerId
        - username
        - playerColor
        - isAdmin
        - identifierToken
    LobbyStateData:
      type: object
      properties:
        players:
          type: array
          items:
            $ref: "#/components/schemas/LobbyPlayer"
          maxItems: 4
        canStart:
          type: boolean
      required:
        - players
        - canStart
    GameStartedData:
      type: object
      properties:
        rows:
