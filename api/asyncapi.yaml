          $ref: "#/components/schemas/UtcTimestamp"
        spareTile:
          $ref: "#/components/schemas/Tile"
      description: Das konkrete PDF-Beispiel enthält keine board-Matrix. Unmittelbar anschließend zwingend
        vollständiges GAME_STATE_UPDATE und private NEXT_TREASURE senden; README erläutert den
        Widerspruch zum Begleittext.
      required:
        - rows
        - cols
        - gameEndTime
        - spareTile
