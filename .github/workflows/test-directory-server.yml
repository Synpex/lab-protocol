name: Test directory server

on:
  push:
    paths:
      - 'directory-server/**'
      - '.github/workflows/test-directory-server.yml'
  pull_request:
    paths:
      - 'directory-server/**'
      - '.github/workflows/test-directory-server.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw --batch-mode --no-transfer-progress test
        working-directory: directory-server
